<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Petrofuel Dispatch Mobile application.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Petrofuel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Petrofuel</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #0f172a;
      /* Deep slate dark background */
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
    }

    .brand-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.35);
      animation: pulse 2.2s infinite ease-in-out;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #f8fafc;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .spinner-wrapper {
      position: relative;
      width: 38px;
      height: 38px;
      margin: 16px 0 14px;
    }

    .spinner {
      width: 100%;
      height: 100%;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #38bdf8;
      /* Sky blue accent */
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }

    /* Live Progress Bar */
    #progress-container {
      width: 200px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      margin: 10px 0 8px;
      display: none;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      border-radius: 9999px;
      transition: width 0.2s ease-out;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    #progress-metrics {
      font-size: 12px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 6px;
      display: none;
      letter-spacing: 0.3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    #status-text {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.3px;
      text-align: center;
      max-width: 82%;
      line-height: 1.4;
    }

    .offline-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div id="loading-container">
    <img class="brand-logo" src="icons/Icon-192.png" alt="Petrofuel" onerror="this.style.display='none'">
    <div class="app-title">PETROFUEL</div>
    <div class="spinner-wrapper">
      <div class="spinner"></div>
    </div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-metrics"></div>
    <div id="status-text">Memuat aplikasi & engine...</div>
  </div>

  <script>
    const statusText = document.getElementById('status-text');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressMetrics = document.getElementById('progress-metrics');

    let isUpdating = false;
    let isSplashHidden = false;

    // --- Update Live Download Progress Bar ---
    function updateProgress(loadedBytes, totalBytes) {
      if (!progressContainer || !progressBar || !progressMetrics) return;

      progressContainer.style.display = 'block';
      progressMetrics.style.display = 'block';

      if (totalBytes > 0) {
        const percent = Math.min(Math.round((loadedBytes / totalBytes) * 100), 100);
        progressBar.style.width = percent + '%';
        const loadedMB = (loadedBytes / (1024 * 1024)).toFixed(1);
        const totalMB = (totalBytes / (1024 * 1024)).toFixed(1);
        progressMetrics.textContent = `${percent}% (${loadedMB} MB / ${totalMB} MB)`;
        statusText.textContent = 'Mengunduh aplikasi & engine...';
      } else {
        const loadedMB = (loadedBytes / (1024 * 1024)).toFixed(1);
        progressBar.style.width = '70%';
        progressMetrics.textContent = `${loadedMB} MB terunduh`;
        statusText.textContent = 'Mengunduh aplikasi...';
      }
    }

    // --- Hide Splash Screen with Smooth Fade Transition ---
    function hideSplashScreen() {
      if (isSplashHidden) return;
      isSplashHidden = true;
      const container = document.getElementById('loading-container');
      if (container) {
        container.style.opacity = '0';
        container.style.pointerEvents = 'none';
        setTimeout(() => {
          if (container.parentNode) {
            container.remove();
          }
        }, 550);
      }
    }

    // --- Observe Flutter First Frame or Element Insertion ---
    function startFlutterFrameObserver() {
      window.addEventListener('flutter-first-frame', hideSplashScreen, { once: true });

      const observer = new MutationObserver((mutations, obs) => {
        const flutterView = document.querySelector('flutter-view') || 
                            document.querySelector('flt-glass-pane') ||
                            document.querySelector('flt-scene');
        if (flutterView) {
          obs.disconnect();
          setTimeout(hideSplashScreen, 250);
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(hideSplashScreen, 15000);
    }

    // --- Register Custom Service Worker ---
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then((registration) => {
          console.log('[PWA] ServiceWorker active with scope:', registration.scope);
        }).catch((err) => {
          console.warn('[PWA] ServiceWorker registration failed:', err);
        });
      }
    }

    // --- Request Persistent Storage for IndexedDB (Prevents Eviction) ---
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then((persistent) => {
        console.log('PWA Persistent storage granted:', persistent);
      }).catch((e) => {
        console.log('Persistent storage request skipped:', e);
      });
    }

    async function checkVersionAndBoot() {
      startFlutterFrameObserver();

      // Offline mode: Boot immediately from CacheStorage
      if (navigator.onLine === false) {
        console.log('[PWA] Offline mode detected, booting from local cache.');
        statusText.innerHTML = 'Membuka dalam mode offline...<br><span class="offline-badge">Offline Ready</span>';
        registerServiceWorker();
        loadFlutterBootstrap();
        return;
      }

      try {
        const storedVersion = localStorage.getItem('app_version');
        const response = await fetch('version.json?t=' + Date.now());
        if (response.ok) {
          const serverData = await response.json();
          const serverVersion = serverData.version + '+' + serverData.build_number;

          if (storedVersion && storedVersion !== serverVersion) {
            isUpdating = true;
            statusText.textContent = 'Memperbarui aplikasi ke versi terbaru (v' + serverVersion + ')...';
            console.log('[PWA Update] Version mismatch: local=' + storedVersion + ', server=' + serverVersion);

            // 1. Purge all existing CacheStorage caches
            if ('caches' in window) {
              try {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              } catch (cacheErr) {
                console.warn('[PWA Update] Cache purge warning:', cacheErr);
              }
            }

            // 2. Unregister active service workers
            if ('serviceWorker' in navigator) {
              try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const reg of registrations) {
                  await reg.unregister();
                }
              } catch (swErr) {
                console.warn('[PWA Update] ServiceWorker unregister warning:', swErr);
              }
            }

            // 3. Update localStorage version
            localStorage.setItem('app_version', serverVersion);

            // 4. Reload page once to fetch latest code
            setTimeout(() => {
              window.location.reload();
            }, 300);
            return;
          } else if (!storedVersion) {
            localStorage.setItem('app_version', serverVersion);
          }
        }
      } catch (e) {
        console.log('Version check skipped (offline or error):', e);
      }

      // Normal online boot
      registerServiceWorker();
      loadFlutterBootstrap();
    }

    async function loadFlutterBootstrap() {
      if (isUpdating) return;

      // If browser supports streaming response, track bootstrap download
      try {
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        script.onload = () => {
          if (progressBar) progressBar.style.width = '100%';
          if (progressMetrics) progressMetrics.textContent = '100%';
          statusText.textContent = 'Menginisialisasi Flutter Engine...';
        };
        document.body.appendChild(script);
      } catch (err) {
        console.warn('Bootstrap script error:', err);
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }
    }

    // Execute check & boot
    checkVersionAndBoot();
  </script>
</body>

</html>
